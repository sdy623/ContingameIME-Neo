modLoader="kotlinforforge"
loaderVersion="[${kotlinforforge_major},)"
license="LGPL-3.0"

[[mods]]
modId="ingameime"
version="${version}"
displayName="ContingameIME-Neo"
description='''
Enable IME in FullScreen Minecraft.
'''
logoFile="icon.png"
authors="ThinkingStudio, TexTrue, Wybxc, Windmill_City, Wudji, sdy623"

[[mixins]]
config="kitsuneime.forge.mixins.json"

[[dependencies.ingameime]]
modId="forge"
type="required"
versionRange="[${forge_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.ingameime]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.ingameime]]
modId="architectury"
type="required"
versionRange="[${architectury_version},)"
ordering="AFTER"
side="CLIENT"

[[dependencies.ingameime]]
modId="cloth_config"
type="required"
versionRange="[${cloth_config_version},)"
ordering="AFTER"
side="CLIENT"

[[dependencies.ingameime]]
modId="mixinextras"
type="required"
versionRange="[0.4.1,)"
ordering="AFTER"
side="CLIENT"
