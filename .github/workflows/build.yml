name: Build

on: [ pull_request, push, workflow_dispatch ]

permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.21'
            loader: all
          - minecraft: '1.20'
            loader: all
          - minecraft: '1.20.1'
            loader: all
          - minecraft: '1.20.2'
            loader: all
          - minecraft: '1.20.3'
            loader: fabric
          - minecraft: '1.20.4'
            loader: all
          - minecraft: '1.20.5'
            loader: all
          - minecraft: '1.20.6'
            loader: all
          - minecraft: '1.21.1'
            loader: all
          - minecraft: '1.21.2'
            loader: fabric
          - minecraft: '1.21.3'
            loader: all
          - minecraft: '1.21.4'
            loader: all
          - minecraft: '1.21.5'
            loader: all
          - minecraft: '1.21.6'
            loader: fabric
          - minecraft: '1.21.7'
            loader: fabric
          - minecraft: '1.21.8'
            loader: all
          - minecraft: '1.21.9'
            loader: fabric
          - minecraft: '1.21.10'
            loader: all
          - minecraft: '1.21.11'
            loader: all

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-${{ matrix.minecraft }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'versions/*.properties') }}
      - name: Build with Gradle
        run: python3 tools/build_version.py '${{ matrix.minecraft }}' --loader '${{ matrix.loader }}'

      - name: Package release JARs
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 tools/package_release_artifacts.py '${{ matrix.minecraft }}' "$GITHUB_REF_NAME" dist

      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.minecraft }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 7

  Release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: Build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify release matrix
        run: python3 tools/package_release_artifacts.py --verify-all dist "$GITHUB_REF_NAME"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ContingameIME-Neo ${{ github.ref_name }}
          body: |
            Multi-loader release from the current 1.20–1.21 compatibility work.

            This release contains 34 build-verified production JARs: 19 Fabric, 4 Forge, and 11 NeoForge targets. Each filename identifies its Minecraft version and loader. See `MULTIVERSION.md` for the full matrix and remaining compatibility gaps.

            Minecraft 1.18.2, 1.16.5, and 1.12.2 are not included in this release.
          files: dist/*.jar
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
