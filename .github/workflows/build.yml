name: Build

on: [ pull_request, push, workflow_dispatch ]

jobs:
  Build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.21'
            loader: all
          - minecraft: '1.20'
            loader: all
          - minecraft: '1.20.1'
            loader: all
          - minecraft: '1.20.2'
            loader: all
          - minecraft: '1.20.3'
            loader: fabric
          - minecraft: '1.20.4'
            loader: all
          - minecraft: '1.20.5'
            loader: all
          - minecraft: '1.20.6'
            loader: all
          - minecraft: '1.21.1'
            loader: all
          - minecraft: '1.21.2'
            loader: fabric
          - minecraft: '1.21.3'
            loader: all
          - minecraft: '1.21.4'
            loader: all
          - minecraft: '1.21.5'
            loader: all
          - minecraft: '1.21.6'
            loader: fabric
          - minecraft: '1.21.7'
            loader: fabric
          - minecraft: '1.21.8'
            loader: all
          - minecraft: '1.21.9'
            loader: fabric
          - minecraft: '1.21.10'
            loader: all
          - minecraft: '1.21.11'
            loader: all

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-${{ matrix.minecraft }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'versions/*.properties') }}
      - name: Build with Gradle
        run: python3 tools/build_version.py '${{ matrix.minecraft }}' --loader '${{ matrix.loader }}'
